name: Windows Installer (unsigned alpha)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install reproducible dependencies and run full regressions
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Package bundled desktop runtime and native Windows installer
        shell: powershell
        run: |
          .\scripts\build-windows-installer.ps1 -Version '0.1.0.${{ github.run_number }}'
      - name: Upload unsigned alpha Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FortLedger-Windows-Setup-alpha
          path: dist/installer/FortLedger-Setup-*-win-x64.exe
          if-no-files-found: error
          retention-days: 30
